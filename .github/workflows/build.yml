name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64 (VST3 + APP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache VST3 SDK
        id: cache-vst3
        uses: actions/cache@v4
        with:
          path: third_party/iPlug2/Dependencies/IPlug/VST3_SDK
          key: vst3sdk-v3.8.1_build_84-${{ runner.os }}

      - name: VST3 SDK
        # iPlug2 子模块强制跟踪了 VST3_SDK/README.md, checkout 后目录非空,
        # 必须先清理再克隆, 否则 git clone 报 "already exists and is not an empty directory"
        if: steps.cache-vst3.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          if (Test-Path third_party/iPlug2/Dependencies/IPlug/VST3_SDK) {
            Remove-Item -Recurse -Force third_party/iPlug2/Dependencies/IPlug/VST3_SDK
          }
          git clone --recursive --branch v3.8.1_build_84 --shallow-submodules `
            https://github.com/steinbergmedia/vst3sdk.git `
            third_party/iPlug2/Dependencies/IPlug/VST3_SDK

      - name: 激活 MSVC x64 环境
        # VS 生成器在 CI 上偶发探测不到 VS 实例, 改用 Ninja + 显式 MSVC 环境 (GitHub 官方推荐)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Ninja)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 + APP
        run: cmake --build build --target ORMBandPass-vst3 ORMBandPass-app

      - name: DSP 自测
        run: |
          cmake --build build --target dsp_test
          .\build\dsp_test.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ORMBandPass-win-x64
          path: build/out/*
          if-no-files-found: error

  macos:
    name: macOS (VST3 + AU + APP)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache VST3 SDK
        id: cache-vst3
        uses: actions/cache@v4
        with:
          path: third_party/iPlug2/Dependencies/IPlug/VST3_SDK
          key: vst3sdk-v3.8.1_build_84-${{ runner.os }}

      - name: VST3 SDK
        # 同 Windows: 子模块带出的 README.md 会让克隆失败, 先清理再获取
        if: steps.cache-vst3.outputs.cache-hit != 'true'
        run: |
          rm -rf third_party/iPlug2/Dependencies/IPlug/VST3_SDK
          sh scripts/get_vst3_sdk.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 + AU + APP
        run: cmake --build build --target ORMBandPass-vst3 ORMBandPass-au ORMBandPass-app

      - name: DSP 自测
        run: |
          cmake --build build --target dsp_test
          ./build/dsp_test

      - uses: actions/upload-artifact@v4
        with:
          name: ORMBandPass-mac
          path: build/out/*
          if-no-files-found: error
