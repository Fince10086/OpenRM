name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64 (VST3 + APP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: VST3 SDK
        run: |
          git clone --recursive --branch v3.8.1_build_84 --shallow-submodules `
            https://github.com/steinbergmedia/vst3sdk.git `
            third_party/iPlug2/Dependencies/IPlug/VST3_SDK
        shell: powershell

      - name: Configure (VS2022 x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 + APP
        run: cmake --build build --config Release --target ORMBandPass-vst3 ORMBandPass-app

      - name: DSP 自测
        run: |
          cmake --build build --config Release --target dsp_test
          .\build\Release\dsp_test.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ORMBandPass-win-x64
          path: build/out/*
          if-no-files-found: error

  macos:
    name: macOS (VST3 + AU + APP)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: VST3 SDK
        run: sh scripts/get_vst3_sdk.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 + AU + APP
        run: cmake --build build --target ORMBandPass-vst3 ORMBandPass-au ORMBandPass-app

      - name: DSP 自测
        run: |
          cmake --build build --target dsp_test
          ./build/dsp_test

      - uses: actions/upload-artifact@v4
        with:
          name: ORMBandPass-mac
          path: build/out/*
          if-no-files-found: error
